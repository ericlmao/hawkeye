version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - '*'
    # The engine's PaperPluginLoader resolves these at server start; the catalog must match the
    # versions it resolves, so they move only together with the engine (docs/knowledge "Build facts").
    ignore:
      - dependency-name: gg.moonrise.moss:moss-paper
      - dependency-name: org.springframework:spring-context
      - dependency-name: jakarta.annotation:jakarta.annotation-api
      - dependency-name: org.incendo:cloud-paper
      - dependency-name: org.incendo:cloud-annotations
      - dependency-name: de.exlll:configlib-yaml
      # log4j is the server's: main compiles against the log4j-core of the oldest supported Paper (1.21.1), the
      # tests against the one paper-api 26.3 brings. Both move with Paper, not on their own.
      - dependency-name: org.apache.logging.log4j:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    # gradle/actions v6 moved caching into a closed-source component under Gradle's Terms of Use.
    # Stay on v5 until the owner decides to accept those terms (docs/knowledge "Build facts").
    ignore:
      - dependency-name: gradle/actions
        versions: ['>= 6']
