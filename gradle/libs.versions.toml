[versions]
shadow = "9.6.1"
# Uploads release and development jars to Modrinth (`./gradlew modrinth`).
modrinthMinotaur = "2.10.0"
# The newest Paper API: the newerApi source set and the tests compile against it.
paper = "26.3.build.258-stable"
# The oldest supported Paper API: main compiles against it, and paper-plugin.yml's api-version names it
# (verifyPluginJar checks both agree). Raising it drops support for the servers below it.
paperOldest = "26.3.build.258-stable"
lombok = "1.18.48"
jetbrainsAnnotations = "26.1.0"

# Moonrise plugin-engine and the runtime libraries its loader resolves (PaperPluginLoader defaults).
# Keep these five in step with the engine: the plugin compiles against them, the server runs the loader's.
engine = "1.10.2"
mossPaper = "1.2.3"
springContext = "6.2.13"
jakarta = "3.0.0"
cloudPaper = "2.0.1"
cloudAnnotations = "2.0.0"
configLib = "4.8.1"

# Hawkeye's own runtime libraries, resolved by HawkeyePluginLoader at server start (never shaded).
# HawkeyePluginLoaderTest fails when the loader's coordinates drift from these.
hikari = "7.1.0"
sqlite = "3.54.1.0"
mariadb = "4.0.0"
postgresql = "42.7.14"
caffeine = "3.3.1"
lettuce = "7.9.0.RELEASE"
zstd = "1.5.7-28"

# log4j-core as Paper 1.21.1 (the oldest supported server) ships it: main compiles the error log's log4j filter
# against it, and every Paper server provides log4j-core at run time (1.21.1 2.22.1 up to 26.3 2.26.0).
log4jCore = "2.22.1"
# log4j for the tests, as paper-api 26.3 (the tests' server API) brings log4j-api.
log4jTest = "2.26.0"

# Testing
junitJupiter = "6.1.3"
junitPlatformLauncher = "6.1.3"
mockbukkit = "4.124.0"
archunit = "1.5.1"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
paperOldest = { module = "io.papermc.paper:paper-api", version.ref = "paperOldest" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jetbrainsAnnotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }

# Engine (Moonrise)
engine = { module = "gg.moonrise.engine:plugin-engine-paper", version.ref = "engine" }
mossPaper = { module = "gg.moonrise.moss:moss-paper", version.ref = "mossPaper" }

# Spring
springContext = { module = "org.springframework:spring-context", version.ref = "springContext" }
jakarta = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta" }

# Cloud Command Framework
cloudPaper = { module = "org.incendo:cloud-paper", version.ref = "cloudPaper" }
cloudAnnotations = { module = "org.incendo:cloud-annotations", version.ref = "cloudAnnotations" }

configLib = { module = "de.exlll:configlib-yaml", version.ref = "configLib" }

# Storage, caching and the network bus
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
zstd = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }

# Logging: the server's log4j (never shaded)
log4jCore = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4jCore" }
log4jCoreTest = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4jTest" }
log4jSlf4jTest = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4jTest" }

# Testing
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[bundles]
# Resolved by the engine's PaperPluginLoader at server start: compileOnly for main, on the test class path.
engineRuntime = ["mossPaper", "springContext", "jakarta", "cloudPaper", "cloudAnnotations", "configLib"]
# Resolved by HawkeyePluginLoader at server start: compileOnly for main, on the test class path.
hawkeyeRuntime = ["hikari", "sqlite", "mariadb", "postgresql", "caffeine", "lettuce", "zstd"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
modrinthMinotaur = { id = "com.modrinth.minotaur", version.ref = "modrinthMinotaur" }
